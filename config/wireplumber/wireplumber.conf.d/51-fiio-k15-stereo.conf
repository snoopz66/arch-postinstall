# The FiiO K15 runs the Pro Audio profile (direct channels), which names its two outputs AUX0/AUX1.
# Name them FL/FR so stereo apps and PipeWire monitor streams (the audio widget's peak meter) map to them.
# https://docs.pipewire.org/page_module_alsa.html
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-.*FIIO_K15.*pro-output-0" } ]
    actions = { update-props = { audio.position = [ FL, FR ] } }
  }
]
