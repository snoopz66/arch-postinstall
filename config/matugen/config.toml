# Material colors from the wallpaper, rendered into every shell config.
# https://github.com/InioX/matugen/wiki/Configuration
[config]

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/colors-hyprlock.conf"

[templates.hyprpaper]
input_path = "~/.config/matugen/templates/hyprpaper.conf"
output_path = "~/.config/hypr/hyprpaper.conf"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/theme.css"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/theme.rasi"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync.css"
output_path = "~/.config/swaync/style.css"

# the login screen; /var/lib/greeter is created by arch-postinstall.sh, see bin/greeter-sync
[templates.regreet]
input_path = "~/.config/matugen/templates/regreet.css"
output_path = "/var/lib/greeter/regreet.css"

# every Material role as JSON; quickshell's Theme.qml watches it
[templates.quickshell]
input_path = "~/.config/matugen/templates/colors.json"
output_path = "~/.cache/wallpaper/colors.json"
